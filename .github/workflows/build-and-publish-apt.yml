name: Build and Publish APT Repo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update version in control file
        run: |
          sed -i "s/^Version:.*/Version: ${{ steps.version.outputs.VERSION }}/" lytescope_0.1.0/DEBIAN/control

      - name: Build .deb
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg --list-secret-keys --keyid-format LONG

      - name: Export public GPG key
        run: |
          gpg --export "${{ secrets.GPG_KEY_ID }}" > lytescope.gpg

      - name: Restore previously released packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p apt/pool/main

          RESTORE_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$RESTORE_DIR"' EXIT

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .assets[] | select(.name == "lytescope.deb") | .id' \
            > "$RESTORE_DIR/asset-ids"

          while IFS= read -r ASSET_ID; do
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
              > "$RESTORE_DIR/package.deb"

            PACKAGE="$(dpkg-deb --field "$RESTORE_DIR/package.deb" Package)"
            VERSION="$(dpkg-deb --field "$RESTORE_DIR/package.deb" Version)"
            ARCH="$(dpkg-deb --field "$RESTORE_DIR/package.deb" Architecture)"

            if [ "$PACKAGE" != "lytescope" ] || [ "$ARCH" != "all" ]; then
              echo "Unexpected package in release asset $ASSET_ID"
              exit 1
            fi

            cp "$RESTORE_DIR/package.deb" \
              "apt/pool/main/lytescope_${VERSION}_${ARCH}.deb"
          done < "$RESTORE_DIR/asset-ids"

      - name: Set up APT repo structure
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          mkdir -p apt/pool/main
          mkdir -p apt/dists/stable/main/binary-all
          mkdir -p apt/dists/stable/main/binary-amd64

          cp lytescope.deb apt/pool/main/lytescope_${VERSION}_all.deb
          cp lytescope.gpg apt/lytescope.gpg

          echo "apt.lytescope.com" > apt/CNAME

          cd apt

          dpkg-scanpackages --arch all pool/main > dists/stable/main/binary-all/Packages
          gzip -9c dists/stable/main/binary-all/Packages > dists/stable/main/binary-all/Packages.gz

          cp dists/stable/main/binary-all/Packages dists/stable/main/binary-amd64/Packages
          cp dists/stable/main/binary-all/Packages.gz dists/stable/main/binary-amd64/Packages.gz

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Lytescope" \
            -o APT::FTPArchive::Release::Label="Lytescope" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Architectures="amd64 all" \
            release dists/stable > dists/stable/Release

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --clearsign -o dists/stable/InRelease dists/stable/Release

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lytescope.deb

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4